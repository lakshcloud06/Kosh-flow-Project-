services:
  mysql:
    image: mysql:8.0
    container_name: koshflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: koshflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koshflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=koshflow
      - JWT_SECRET=koshflow_secret_key_atm_cash_demand_forecasting_2026
      - JWT_EXPIRE_MINUTES=1440
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./ATM_cash_demand.csv:/app/ATM_cash_demand.csv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: koshflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
